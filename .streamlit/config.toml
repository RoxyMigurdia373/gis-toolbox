[server]
address = "127.0.0.1"
headless = true
fileWatcherType = "none"
maxUploadSize = 500
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[global]
developmentMode = false


[theme]
primaryColor = "#245BD8"
backgroundColor = "#F2F5FA"
secondaryBackgroundColor = "#E9EEF7"
textColor = "#24364B"
