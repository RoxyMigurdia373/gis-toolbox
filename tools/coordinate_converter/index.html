<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f3f5f7"><title>坐标转换器</title><link rel="stylesheet" href="style.css"></head><body><main>
<header><h1>坐标转换器</h1><p>三种格式互转 · 经度在前，纬度在后</p></header>
<div class="modes"><label>输入格式<select id="from" aria-label="输入格式"><option value="dms">度分秒</option><option value="dd">十进制度</option><option value="dm">度分（小数分）</option></select></label><button id="swap" aria-label="交换输入输出格式">⇄</button><label>输出格式<select id="to" aria-label="输出格式"><option value="dd">十进制度</option><option value="dms">度分秒</option><option value="dm">度分（小数分）</option></select></label></div>
<div id="coordinates"></div>
<section class="result" aria-label="转换结果"><div class="result-top"><span id="result-label">十进制度</span><select id="precision" aria-label="保留小数位数"><option value="2">2 位小数</option><option value="3" selected>3 位小数</option><option value="4">4 位小数</option><option value="5">5 位小数</option><option value="6">6 位小数</option></select></div><textarea id="result" aria-label="可复制的经纬度" rows="2" readonly placeholder="等待输入"></textarea><button id="copy" disabled>复制坐标</button></section>
<section class="zones" aria-label="投影分带"><h2>投影分带 · 自动计算</h2><div id="zones" aria-live="polite">输入完整经纬度后显示</div><small>按经纬度推荐分带，不转换大地基准或投影坐标。分界线上采用东侧带；项目指定坐标系优先。</small></section>
<div class="keypad" aria-label="数字键盘"><button data-key="7" class="" >7</button><button data-key="8" class="" >8</button><button data-key="9" class="" >9</button><button data-key="4" class="" >4</button><button data-key="5" class="" >5</button><button data-key="6" class="" >6</button><button data-key="1" class="" >1</button><button data-key="2" class="" >2</button><button data-key="3" class="" >3</button><button data-key="." class="" >.</button><button data-key="0" class="" >0</button><button data-key="backspace" class="" aria-label="删除一位">⌫</button><button data-key="clear" class="utility" >全部清空</button><button data-key="sign" class="utility" >正负 ±</button><button data-key="next" class="next" >下一项 →</button></div>
<p id="status" class="status" role="status" aria-live="polite">输入或粘贴坐标，自动转换</p></main>
<script src="app.js"></script></body></html>
